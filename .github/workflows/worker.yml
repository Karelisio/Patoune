name: Worker

on:
  push:
    branches: ["**"]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      - name: Base D1 (création si absente)
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="patoune");process.stdout.write(d?d.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create patoune
            ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="patoune").uuid)')
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "D1 : $ID"

      - name: Bucket R2 (création si absent)
        run: |
          if ! npx wrangler r2 bucket list | grep -q "patoune-media"; then npx wrangler r2 bucket create patoune-media; fi

      - name: Migrations D1
        run: npx wrangler d1 migrations apply patoune --remote

      - name: Déploiement
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Worker déployé : $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Définir la variable de dépôt WORKER_URL=$URL pour l'appli." >> "$GITHUB_STEP_SUMMARY"

      - name: Secret FCM
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT; fi
